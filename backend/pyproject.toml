[project]
name = "hrms-backend"
version = "0.1.0"
description = "Sigvitas HRMS API, worker and migrations"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.142,<0.143",
    "procrastinate==3.10.0",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "redis>=8.1,<9",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "import-linter>=2.15,<3",
    "mypy>=2.3,<3",
    "pip-audit>=2.10,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
    "testcontainers>=4.15,<5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["migrations/vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF", "ASYNC", "PT", "T20", "DTZ", "PL"]
ignore = [
    "PLR2004", # magic values are fine in comparisons with named constants nearby
    "PLR0913", # keyword-only settings-style arguments
]

[tool.ruff.lint.per-file-ignores]
# Tests compose SQL only from their own constants (table names, fixed statements), never input.
"tests/**" = ["S101", "S105", "S106", "S608", "PLR2004"]
# Revisions build DDL from identifiers quoted by the dialect and constants defined in code.
"migrations/**" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["app", "migrations"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
exclude = ['^migrations/vendor/', '^\.venv/']

[[tool.mypy.overrides]]
module = ["testcontainers.*", "procrastinate.*"]
ignore_missing_imports = true

# Module boundaries (docs/architecture.md §4): a module is imported by other modules only
# through its public.py, and the platform imports no module. app.metadata is the composition
# root that collects every module's models. Each new module adds one "protected" contract.
[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Platform imports no business module"
type = "forbidden"
source_modules = ["app.platform"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "org is imported only through org.public"
type = "protected"
protected_modules = ["app.modules.org"]
allowed_importers = ["app.modules.org", "app.metadata"]
ignore_imports = ["app.** -> app.modules.org.public"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "people is imported only through people.public"
type = "protected"
protected_modules = ["app.modules.people"]
allowed_importers = ["app.modules.people", "app.metadata"]
ignore_imports = ["app.** -> app.modules.people.public"]
unmatched_ignore_imports_alerting = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
