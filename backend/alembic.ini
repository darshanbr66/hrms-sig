# Alembic runs only as hrms_migrator; the connection URL comes from DATABASE_URL_MIGRATOR
# (docs/database-design.md §11). Run from backend/: uv run --env-file ../.env alembic upgrade head
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

