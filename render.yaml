# Render Blueprint for the Sigvitas HRMS backend (docs/deployment.md, ADR-030). PROPOSED, not
# applied: creating the service is a manual, approved step (docs/deployment.md §5). Every secret
# is `sync: false` (entered once in the Render dashboard) or generated by Render; none is here.
#
# Topology: the SPA is on Vercel and forwards /api/* to hrms-api (frontend/vercel.json), so the
# browser sees one origin and there is no CORS (docs/architecture.md §10). Data, sessions,
# rate-limit counters, jobs and files are in MongoDB Atlas (database `hrms`); email goes out
# through Resend's HTTPS API. There is no Render database, Redis, worker, cron job or ClamAV.
#
# One web service runs the API and, with RUN_JOBS_IN_API=true, the scheduled jobs (email
# outbox, audit sealing, checkpoints, witness and retention, exports, leave accrual, grant
# expiry). Plan `starter` keeps it running; on `free` the service sleeps after 15 minutes
# without traffic and the jobs pause with it (docs/deployment.md §3). Audit retention does not
# run here (B5). Readiness also fails when the jobs stop or stop beating, so Render restarts it.
#
# Migrations are not run by Render: an operator runs `python -m app.cli migrate` as the Atlas
# migration user before each deploy that needs it (docs/deployment.md §6), so this service
# never holds the migration user's credentials.

services:
  - type: web
    name: hrms-api
    runtime: docker
    region: singapore
    plan: starter
    numInstances: 1
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Ready only when MongoDB answers and the jobs are running.
    healthCheckPath: /api/health/ready
    # Deploy after migrating (docs/deployment.md §6), so nothing deploys on its own.
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_DOCS_ENABLED
        value: "false"
      - key: HIBP_ENABLED
        value: "true"
      - key: APP_BASE_URL
        sync: false
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      # MongoDB Atlas: one database user per purpose (docs/deployment.md §4).
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: hrms
      - key: RUN_JOBS_IN_API
        value: "true"
      - key: MONGODB_WORKER_URI
        sync: false
      # No MONGODB_AUDIT_RETENTION_URI, AUDIT_LOG_RETENTION_MONTHS or
      # SECURITY_EVENTS_RETENTION_MONTHS: audit retention never runs inside the internet-facing
      # API, and the service refuses to start with them (docs/deployment.md B5). Every audit
      # record is kept until a separate worker runs retention.
      # 256-bit random values, base64: what these keys require. One key per purpose.
      - key: RATE_LIMIT_KEY_HMAC_KEY
        generateValue: true
      - key: EMAIL_LOOKUP_HMAC_KEY
        generateValue: true
      - key: DOWNLOAD_LINK_HMAC_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      - key: FIELD_ENCRYPTION_ACTIVE_VERSION
        value: "1"
      # Email: Resend's HTTPS API, from a verified sending domain.
      - key: EMAIL_TRANSPORT
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Audit integrity (docs/security-architecture.md §8.1).
      - key: AUDIT_SIGNING_KEY_ID
        sync: false
      - key: AUDIT_SIGNING_PRIVATE_KEY
        sync: false
      - key: AUDIT_VERIFY_PUBLIC_KEYS
        sync: false
      # Required in production: the service refuses to start without a recipient (B4).
      - key: AUDIT_WITNESS_EMAILS
        sync: false
      # No ClamAV in this deployment: uploads are refused rather than accepted unscanned (DOC-5).
      - key: DOCUMENT_UPLOADS_ENABLED
        value: "false"
      # Office location verification (ADR-031) stays off until its retention purge, privacy
      # notice approval and one-office pilot are in place (docs/module-acceptance.md 15.1).
      - key: LOCATION_CHECKS_ENABLED
        value: "false"
