# Render Blueprint for the Sigvitas HRMS backend (docs/deployment.md). PROPOSED, not applied:
# creating these services is a manual, approved step (docs/deployment.md §5). Every secret is
# `sync: false` (entered once in the Render dashboard) or generated by Render; none is here.
#
# Topology: the SPA is on Vercel and forwards /api/* to hrms-api (frontend/vercel.json), so the
# browser sees one origin and there is no CORS (docs/architecture.md §10). Object storage is AWS
# S3 (documents and exports, and the Object Lock bucket for audit anchors); email is Resend
# over SMTP; the rate-limit store is a TLS Redis (REDIS_URL). Those are outside this file.
#
# Open decisions that block a working deployment are listed in docs/deployment.md §2; the
# settings validation refuses to start rather than run without TLS, scanning or storage.

databases:
  # PostgreSQL 18 is required (uuidv7(), transaction_timeout). Render creates one default user;
  # the four HRMS roles and the `hrms` database are created once with
  # infra/db/bootstrap-roles.sql (docs/deployment.md §6). No external access by default.
  - name: hrms-db
    databaseName: hrms_admin
    postgresMajorVersion: "18"
    region: singapore
    plan: 0.5c-1g
    ipAllowList: []

services:
  # API. Health: /api/health/ready (database reachable). Holds only the API's credentials.
  - type: web
    name: hrms-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    # Deployment order is migrate, worker, API (docs/database-design.md §11), so nothing
    # deploys on its own.
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_DOCS_ENABLED
        value: "false"
      - key: HIBP_ENABLED
        value: "true"
      - key: APP_BASE_URL
        sync: false
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: DATABASE_URL_APP
        sync: false
      - key: REDIS_URL
        sync: false
      # 256-bit random values, base64: what these keys require. One key per purpose.
      - key: RATE_LIMIT_KEY_HMAC_KEY
        generateValue: true
      - key: EMAIL_LOOKUP_HMAC_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      - key: FIELD_ENCRYPTION_ACTIVE_VERSION
        value: "1"
      - key: S3_REGION
        sync: false
      - key: FILES_BUCKET
        sync: false
      - key: FILES_ACCESS_KEY_ID
        sync: false
      - key: FILES_SECRET_ACCESS_KEY
        sync: false

  # Worker: email outbox, audit sealing, checkpoints, anchors and retention, document scans,
  # exports, leave accrual, grant expiry. Must run continuously (its schedules are in-process).
  - type: worker
    name: hrms-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL_WORKER
        sync: false
      - key: DATABASE_URL_AUDIT_RETENTION
        sync: false
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURITY
        value: tls
      - key: SMTP_USERNAME
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: AUDIT_SIGNING_KEY_ID
        sync: false
      - key: AUDIT_SIGNING_PRIVATE_KEY
        sync: false
      - key: AUDIT_VERIFY_PUBLIC_KEYS
        sync: false
      - key: S3_REGION
        sync: false
      - key: AUDIT_ANCHOR_BUCKET
        sync: false
      - key: AUDIT_ANCHOR_ACCESS_KEY_ID
        sync: false
      - key: AUDIT_ANCHOR_SECRET_ACCESS_KEY
        sync: false
      - key: FILES_BUCKET
        sync: false
      - key: FILES_ACCESS_KEY_ID
        sync: false
      - key: FILES_SECRET_ACCESS_KEY
        sync: false
      # Retention periods come from Sigvitas (docs/database-design.md §9); empty keeps everything.
      - key: AUDIT_LOG_RETENTION_MONTHS
        sync: false
      - key: SECURITY_EVENTS_RETENTION_MONTHS
        sync: false
      - key: CLAMAV_HOST
        fromService:
          name: hrms-clamav
          type: pserv
          property: host
      - key: CLAMAV_PORT
        value: "3310"

  # ClamAV daemon, reachable only on Render's private network. It needs about 1.5 GB of memory
  # and more while it reloads signatures. The disk keeps signatures across restarts.
  # Pin the image by digest before the first production deployment.
  - type: pserv
    name: hrms-clamav
    runtime: image
    image:
      url: docker.io/clamav/clamav:1.4.3
    region: singapore
    plan: 2c-4g
    disk:
      name: clamav-signatures
      mountPath: /var/lib/clamav
      sizeGB: 2

  # Migration job: `alembic upgrade head` as hrms_migrator, the only service holding the
  # migrator's credentials. Run it by hand ("Trigger run") before deploying the worker and the
  # API. The schedule exists only because Render requires one; at head a run changes nothing.
  - type: cron
    name: hrms-migrate
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    schedule: "0 3 1 1 *"
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: alembic upgrade head
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL_MIGRATOR
        sync: false
