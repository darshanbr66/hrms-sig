# Local services for development. Every port is bound to 127.0.0.1.
# Start with: docker compose -f infra/compose.yaml up -d --wait
#
# MongoDB runs as a single-member replica set: the application's units of work are
# multi-document transactions, which a standalone server refuses. It has no authentication and
# listens on 127.0.0.1 only; it holds obviously fake local data. Connect with
#   MONGODB_URI=mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
# (run-backend.ps1 sets this for you). Atlas is never needed for local development.
#
# ClamAV scans uploaded documents. It needs about 1.5 GB of memory and downloads its signatures
# on first start, so it runs only with the `scan` profile:
#   docker compose -f infra/compose.yaml --profile scan up -d --wait
# Without it, uploads are refused (DOCUMENT_UPLOADS_ENABLED=false, the default).

name: hrms

services:
  mongo:
    image: mongo:8.0.34
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    # Initiates the replica set on the first check (an initiated set is left alone); healthy
    # once this member is primary.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }) }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 5s

  # Local mail catcher, for EMAIL_TRANSPORT=smtp (SMTP 1025); read mail at http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  clamav:
    image: clamav/clamav:1.4.3
    profiles: ["scan"]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

volumes:
  mongo-data:
  clamav-data:
